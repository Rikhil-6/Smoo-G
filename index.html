<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smoo-G</title>
  <style>
    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background: radial-gradient(circle at top left, #422006, transparent 34%), #09090b;
    }

    main {
      max-width: 720px;
      padding: 32px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 23, 42, 0.76);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
    }

    code {
      display: inline-block;
      padding: 3px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
    }

    a {
      color: #fca5a5;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <h1>Smoo-G Agentic Debate</h1>
    <p>The main app now lives in <code>agentic-debate/</code> as a Next app with QR polling, generated agent perspectives, TokenRouter routing, Kimi turns, BrightData research, and Daytona sandbox hooks.</p>
    <p>Run <code>cd agentic-debate</code>, <code>npm install</code>, then <code>npm run dev</code>. Open <a href="http://localhost:3000">localhost:3000</a>.</p>
  </main>
</body>
</html>
